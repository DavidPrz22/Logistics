services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/dev.db
      PORT: ${PORT:-3000}
    volumes:
      - sqlite-data:/data
    restart: unless-stopped

volumes:
  sqlite-data:
